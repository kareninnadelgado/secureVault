services:
  postgres:
    image: postgres:18
    container_name: securevault-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: securevault
      POSTGRES_PASSWORD: securevault_dev_password
      POSTGRES_DB: securevault

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: